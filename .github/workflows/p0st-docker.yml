name: Build p0st Docker image

on:
  push:
    branches:
      - p0st
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          cache: 'false'

      - name: Test Enable Banking normalization
        run: >
          yarn workspace @actual-app/sync-server test
          src/app-enablebanking/services/tests/normalization.spec.ts

      - name: Build server
        run: yarn build:server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/sync-server/docker/ubuntu.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/actual-server:p0st
            ghcr.io/${{ github.repository_owner }}/actual-server:p0st-${{ github.sha }}
